<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 1rem;
            background-color: #f5f9ef;
        }

        .controls {
            background: white;
            padding-left: 1rem;
            border: 2px solid #333;
            margin-bottom: 1.2rem;
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
        }

        .column-one {
            grid-column: 1;
        }

        .column-one h3 {
            margin-bottom: 0.5rem;
        }

        .display-group {
            grid-column: auto;
        }
        .flex-group {
            grid-column: auto;
        }
        .grid-group {
            grid-column: auto;
            padding-bottom: 1rem;
        }

        .selectedP {
            grid-column: 2;
            grid-row: 1;
        }

        .slidecontainer {
            padding-top: 0.5rem;
        }

        .layout {
            background-color: white;
            border: 2px solid black; 
            padding: 1rem;
        }

        .layout span {
            background-color: skyblue;
            padding: 10px;
            border: 1px solid blue;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="column-one">
            <h3>Display Types</h3>
            <div class="display-group">
                <input type="radio" id="displayN" name="displayType" value="none">
                <label for="displayN">none</label><br>

                <input type="radio" id="displayC" name="displayType" value="contents">
                <label for="displayC">contents</label><br>

                <input type="radio" id="displayI" name="displayType" value="inline">
                <label for="displayI">inline</label><br>

                <input type="radio" id="displayB" name="displayType" value="block">
                <label for="displayB">block</label><br>

                <input type="radio" id="displayIF" name="displayType" value="inline-flex">
                <label for="displayIF">inline-flex</label><br>

                <input type="radio" id="displayIG" name="displayType" value="inline-grid">
                <label for="displayIG">inline-grid</label>
            </div>

            <h3>Flexbox</h3>
            <div class="flex-group">
                <input type="radio" id="jcs" name="flexJustify" value="start">            
                <label for="jcs">start</label><br>
                <input type="radio" id="jcc" name="flexJustify" value="center">
                <label for="jcc">center</label><br>
                <input type="radio" id="jce" name="flexJustify" value="end">
                <label for="jce">end</label><br><br>

                <input type="radio" id="row" name="flexDir" value="row">
                <label for="row">row</label><br>
                <input type="radio" id="rowR" name="flexDir" value="row-reverse">
                <label for="rowR">row-reverse</label><br>
                <input type="radio" id="column" name="flexDir" value="column">
                <label for="column">column</label><br>
                <input type="radio" id="columnR" name="flexDir" value="column-reverse">
                <label for="columnR">column-reverse</label>
            </div>
            <h3>Grid</h3>
            <div class="grid-group">
                <input type="radio" id="displayG" name="grid" value="grid">
                <label for="displayG">grid</label><br>         
                <input type="range" min="1" max="4" value="1" class="slider" id="gridRange">
            </div>
        </div>
        <div class="selectedP">
            <h3 id="selectedPropD"></h3>
            <h3 id="selectedPropJ"></h3>
            <h3 id="selectedPropF"></h3>
            <h3 id="selectedPropG"></h3>
        </div>                    
    </div>

    <div class="layout" id="mainLayout">
        <span>111</span>
        <span>222</span>
        <span>333</span>
        <span>444</span>
        <span>555</span>
        <span>666</span>
        <span>777</span>
        <span>888</span>
        <span>999</span>        
    </div>

    <script>
        const main = document.getElementById('mainLayout');
        const radioDisplay  = document.querySelectorAll('input[name="displayType"]');
        const radioFlex     = document.querySelectorAll('input[name="flexJustify"], input[name="flexDir"]');        
        const radioGrid     = document.querySelectorAll('input[name="grid"]');
        const columnSlider  = document.getElementById('gridRange');

        radioDisplay.forEach(radio => {
            radio.addEventListener('change', function() {
                const val = this.value;
                selectedPropD.textContent = "display: " + val + ";";
                main.style.display = val;
            });
        }); 

        radioFlex.forEach(radio => {
            radio.addEventListener('change', function() {
                const val  = this.value;
                const name = this.name;

                if (name === 'flexJustify') {
                    main.style.justifyContent = val;
                    selectedPropJ.textContent = 'justify-content: ' + val + ';';
                } else if (name === 'flexDir') {
                    main.style.flexDirection = val;
                    selectedPropF.textContent = 'flex-direction: ' + val + ';';
                }

                // Make sure flexbox is active
                main.style.display = 'flex';
                selectedPropD.textContent = "display: " + "flex" + ";";
            });
        });

        radioGrid.forEach(radio => {
            radio.addEventListener('change', function() {
                const val = this.value;
                selectedPropD.textContent = "display: " + val + ";";
                main.style.display = val;
            });
        });        

        columnSlider.addEventListener('input', function() {
            const val = this.value; 
            main.style.gridTemplateColumns = `repeat(${val}, 1fr)`;
        }); 
    </script>
</body>
</html>
